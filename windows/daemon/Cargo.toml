[package]
name = "ntpodsd"
version = "0.1.0"
edition = "2021"
description = "NTPods Windows daemon — owns the AAP driver + hi-res mic, serves the tray/app over IPC."

[features]
experimental-playback = []

[dependencies]
ntpods-ipc = { path = "../ipc" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Bundle SQLite so builds and installations need no separate SQLite package.
rusqlite = { version = "=0.40.1", features = ["bundled"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Bluetooth",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
] }
# COM and WinRT APIs for audio, media controls and BLE advertisements.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Storage_Streams",
] }

[build-dependencies]
cc = "1"

[[bin]]
name = "ntpodsd"
path = "src/main.rs"

[[example]]
name = "decode_hearing_diagnostics"
test = true

[profile.release]
opt-level = "s"
lto = true
strip = true

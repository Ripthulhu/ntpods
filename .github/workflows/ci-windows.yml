name: NTPods USB dongle preview

on:
  push:
    branches: [dongle-only]
  pull_request:
    branches: [dongle-only]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: Cyberboss/install-winget@1c6f189175e9f015bf1aa113cd1cc6c73efb9d47
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.95.0'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Install WinUI build tools
        shell: pwsh
        run: |
          winget install --exact --id Microsoft.VisualStudio.BuildTools --version 18.10.2 --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity --override '--quiet --wait --norestart --add Microsoft.VisualStudio.Workload.UniversalBuildTools --includeRecommended'
          if ($LASTEXITCODE -and $LASTEXITCODE -ne -1978335189) { throw "WinUI tool installation failed ($LASTEXITCODE)" }
      - name: Build and test
        shell: pwsh
        run: |
          $env:LIBCLANG_PATH = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (-not (Test-Path (Join-Path $env:LIBCLANG_PATH 'libclang.dll'))) {
            throw 'The runner is missing x64 LLVM.'
          }
          ./windows/build.ps1
      - name: Check room geometry and speaker gestures
        run: node --test windows/tests/SpatialRoom/geometry.test.cjs windows/tests/SpatialRoom/gestures.test.cjs

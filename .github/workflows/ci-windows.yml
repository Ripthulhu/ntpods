name: NTPods USB dongle preview

on:
  push:
    branches: [dongle-only]
  pull_request:
    branches: [dongle-only]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: Cyberboss/install-winget@1c6f189175e9f015bf1aa113cd1cc6c73efb9d47
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.95.0'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Install WinUI build tools
        shell: pwsh
        run: |
          winget install --exact --id Microsoft.VisualStudio.BuildTools --version 18.10.2 --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity --override '--quiet --wait --norestart --add Microsoft.VisualStudio.Workload.UniversalBuildTools --includeRecommended'
          if ($LASTEXITCODE -and $LASTEXITCODE -ne -1978335189) { throw "WinUI tool installation failed ($LASTEXITCODE)" }
      - name: Build and test
        shell: pwsh
        run: |
          $env:LIBCLANG_PATH = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (-not (Test-Path (Join-Path $env:LIBCLANG_PATH 'libclang.dll'))) {
            throw 'The runner is missing x64 LLVM.'
          }
          ./windows/build.ps1
      - name: Check room geometry and speaker gestures
        run: node --test windows/tests/SpatialRoom/geometry.test.cjs windows/tests/SpatialRoom/gestures.test.cjs
      - name: Prepare downloads
        if: vars.NTPODS_PUBLISH_BUILDS == 'true'
        shell: pwsh
        run: |
          $preview = @(Get-ChildItem windows/build-output/NTPods-Dongle-*.zip -File)
          if ($preview.Count -ne 1) { throw "Expected one tested preview ZIP, found $($preview.Count)." }
          $downloads = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/dongle-downloads"
          Copy-Item -LiteralPath $preview[0].FullName -Destination "$downloads/NTPods-Dongle-Windows-x64.zip"
          git archive --format=zip "--output=$downloads/NTPods-Dongle-source.zip" $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'Could not archive the source commit.' }
          $hashes = Get-ChildItem "$downloads/*.zip" | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))"
          }
          [IO.File]::WriteAllText("$downloads/SHA256SUMS.txt", ($hashes -join "`n") + "`n")
      - name: Upload dongle preview
        if: vars.NTPODS_PUBLISH_BUILDS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ntpods-dongle-windows-${{ github.run_number }}
          path: ${{ runner.temp }}/dongle-downloads/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

  publish:
    needs: preview
    if: >-
      vars.NTPODS_PUBLISH_BUILDS == 'true' &&
      github.repository == 'Ripthulhu/ntpods' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/dongle-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency: publish-dongle-nightly
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ntpods-dongle-windows-${{ github.run_number }}
          path: downloads
      - name: Publish dongle nightly
        working-directory: downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          head=$(gh api "repos/$GH_REPO/git/ref/heads/dongle-only" --jq .object.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on dongle-only. Skipping the nightly update."
            exit 0
          fi
          tag=dongle-nightly
          title="NTPods USB dongle nightly (build $GITHUB_RUN_NUMBER)"
          notes="$RUNNER_TEMP/dongle-release.md"
          echo 'Extract NTPods-Dongle-Windows-x64.zip and open `ntpods-winui.exe`. Windows supplies the USB audio and HID drivers.' > "$notes"
          echo >> "$notes"
          echo "[Source]($GITHUB_SERVER_URL/$GH_REPO/tree/$GITHUB_SHA) · [Build]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)" >> "$notes"
          assets=(NTPods-Dongle-Windows-x64.zip NTPods-Dongle-source.zip SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" --silent
            gh release edit "$tag" --title "$title" --notes-file "$notes" --prerelease --latest=false
          else
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" --prerelease --latest=false
          fi

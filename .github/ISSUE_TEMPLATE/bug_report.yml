name: Bug report
description: Something doesn't work (connecting, battery, noise control, mic, heart rate, installer...)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and attach the diagnostic report from the last step.

        Quick checks before you start:
        - Test Mode is on (it says "Test Mode" in the bottom-right corner of the desktop).
        - The AirPods are paired in **Settings > Bluetooth & devices**. NTPods doesn't pair anything itself.
        - You restarted if setup requested it.

  - type: dropdown
    id: model
    attributes:
      label: AirPods model
      options:
        - AirPods (1st gen)
        - AirPods (2nd gen)
        - AirPods (3rd gen)
        - AirPods 4
        - AirPods 4 (ANC)
        - AirPods Pro (1st gen)
        - AirPods Pro 2 (Lightning)
        - AirPods Pro 2 (USB-C)
        - AirPods Pro 3
        - AirPods Max
        - Beats (write which in the description)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install NTPods?
      options:
        - NTPods.msi
        - NTPods-Windows.zip with install.ps1
        - Built it myself
        - Old LibrePods for Windows build
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: AirPods firmware (if you know it)
      description: On an iPhone, Settings > [your AirPods] > About. Leave empty if you don't know.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead. Screenshots help.
      placeholder: |
        I installed the MSI, restarted and paired the AirPods, but the app stays on "Disconnected"...
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Report file
      description: |
        Paste the command below into PowerShell. It reads system and NTPods information, writes `ntpods-report.txt` to your Desktop and opens it. Administrator access is not required; inaccessible logs are skipped. Attach the file here.

        The report includes Bluetooth addresses and device names. It replaces Windows user names of at least three characters with `<user>`. Review it before posting.

        ```powershell
        $o = "$env:USERPROFILE\Desktop\ntpods-report.txt"
        & {
          "== windows"; [Environment]::OSVersion.VersionString; (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').DisplayVersion
          "== boot options"; (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control').SystemStartOptions
          "== secure boot (1 = on)"; (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\SecureBoot\State' -ErrorAction SilentlyContinue).UEFISecureBootEnabled
          "== ntpods version"; Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object DisplayName -match 'NTPods' | Select-Object DisplayName, DisplayVersion, InstallDate | Format-List | Out-String
          "== bluetooth"; Get-PnpDevice -Class Bluetooth | Select-Object Status, FriendlyName, InstanceId | Format-Table -AutoSize | Out-String -Width 300
          "== ntpods devices"; Get-PnpDevice | Where-Object { $_.FriendlyName -match 'NTPods|LibrePods|AirPods|Beats' } | Select-Object Status, Class, FriendlyName, Problem | Format-Table -AutoSize | Out-String -Width 300
          "== mic driver (NTPodsMicACX = ACX; AudioCodec/NTPodsMicPC = legacy)"; Get-CimInstance Win32_SystemDriver -Filter "Name='NTPodsMicACX' OR Name='AudioCodec' OR Name='NTPodsMicPC'" | Select-Object Name, State | Format-Table -AutoSize | Out-String
          "== processes"; Get-Process ntpods*, librepods* -ErrorAction SilentlyContinue | Select-Object Name, Path | Format-Table -AutoSize | Out-String -Width 300
          "== tasks"; Get-ScheduledTask | Where-Object TaskName -match 'NTPods|LibrePods' | Select-Object TaskName, State | Format-Table -AutoSize | Out-String
          "== latest MSI setup log"
          Get-ChildItem -LiteralPath "$env:ProgramData\NTPods" -Filter 'setup-*.log' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^setup-[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}\.log$' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1 |
            Get-Content -Tail 80 -ErrorAction SilentlyContinue
          "== daemon.log"; Get-Content "$env:LOCALAPPDATA\NTPods\daemon.log" -Tail 200 -ErrorAction SilentlyContinue
          "== rename.log"; Get-Content "$env:LOCALAPPDATA\NTPods\rename.log" -Tail 20 -ErrorAction SilentlyContinue
          "== fix-driver.log"; Get-Content "$env:LOCALAPPDATA\NTPods\fix-driver.log" -Tail 40 -ErrorAction SilentlyContinue
        } *>&1 | Out-String -Width 300 | ForEach-Object { if ($env:USERNAME.Length -ge 3) { $_ -replace [regex]::Escape($env:USERNAME), '<user>' } else { $_ } } | Set-Content $o -Encoding UTF8
        notepad $o
        ```
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Other Bluetooth devices connected, laptop model, whether it ever worked before, etc.
